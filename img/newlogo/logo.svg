<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100" viewBox="0 0 100 100"
     role="img" aria-labelledby="title desc">
  <title id="title">Cat peeking over a blue folder</title>
  <desc id="desc">An editable vector recreation of a white cat with orange ears peeking from a blue and yellow folder, outlined in navy and white.</desc>

  <defs>
    <linearGradient id="earLeft" x1="23" y1="6" x2="35" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fe6e06"/>
      <stop offset="1" stop-color="#fc7309"/>
    </linearGradient>
    <linearGradient id="earRight" x1="81" y1="6" x2="68" y2="25" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fe6e06"/>
      <stop offset="1" stop-color="#fc7309"/>
    </linearGradient>
    <linearGradient id="folderTab" x1="20" y1="41" x2="20" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#feb305"/>
      <stop offset="1" stop-color="#fdb005"/>
    </linearGradient>
    <linearGradient id="folderBlue" x1="51" y1="51" x2="51" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3577dc"/>
      <stop offset="1" stop-color="#3274da"/>
    </linearGradient>
    <linearGradient id="topShine" x1="50" y1="51.8" x2="50" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9bd6ff"/>
      <stop offset="0.55" stop-color="#438ce4"/>
      <stop offset="1" stop-color="#3475db"/>
    </linearGradient>
    <linearGradient id="leftShine" x1="7" y1="59" x2="15" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fa5ee" stop-opacity=".7"/>
      <stop offset="1" stop-color="#4fa5ee" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="folderFrontClip">
      <path d="M5.8 57.1h25.7c1.8 0 3.1-1 3.9-2.5l2.5-4.8h57.8l-4.5 42.6c-.2 1.7-1.5 2.6-3.7 2.6H16.1c-2.3 0-3.7-1-4.1-2.9Z"/>
    </clipPath>
  </defs>

  <!-- The face keyline sits behind the colored ears, so it only shows on the exterior silhouette. -->
  <path id="face-keyline"
        d="M20.2 49.8C20.2 26.7 38.5 11.6 51.7 11.6S83.8 26.8 83.8 49.8v10.4H20.2Z"
        fill="#fefefe" stroke="#ffffff" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Ear silhouettes, behind the face. Each is duplicated for the white keyline. -->
  <g id="ears" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.8 38.3c-.4-10.5-1.4-25.8-.1-33.1 1.5-1.4 2.5-1.7 4.1-1.4L40 14.2 29.4 27.8Z"
          fill="#112452" stroke="#ffffff" stroke-width="7"/>
    <path d="M20.8 38.3c-.4-10.5-1.4-25.8-.1-33.1 1.5-1.4 2.5-1.7 4.1-1.4L40 14.2 29.4 27.8Z"
          fill="#112452" stroke="#112452" stroke-width="3.4"/>
    <path d="M23 25.2c-.2-6.2-.2-12.8.5-17.6.3-1.7 1.1-2.1 2.5-1.1l10.7 7.7Z" fill="url(#earLeft)"/>

    <path d="M82.8 38.6c.6-10.8 1.5-26.1.1-33.4-1.5-1.4-2.5-1.7-4.1-1.4L63.6 14.3l10.7 13.8Z"
          fill="#112452" stroke="#ffffff" stroke-width="7"/>
    <path d="M82.8 38.6c.6-10.8 1.5-26.1.1-33.4-1.5-1.4-2.5-1.7-4.1-1.4L63.6 14.3l10.7 13.8Z"
          fill="#112452" stroke="#112452" stroke-width="3.4"/>
    <path d="M80.8 25.2c.2-6.2.2-12.8-.5-17.6-.3-1.7-1.1-2.1-2.5-1.1l-10.6 7.7Z" fill="url(#earRight)"/>
  </g>

  <!-- White face and its outer navy contour. -->
  <g id="cat-face" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.2 49.8C20.2 26.7 38.5 11.6 51.7 11.6S83.8 26.8 83.8 49.8v10.4H20.2Z"
          fill="#fefefe" stroke="#112452" stroke-width="3.4"/>

    <ellipse id="left-eye" cx="38.5" cy="34.2" rx="3.7" ry="5.4" fill="#112452"/>
    <ellipse id="right-eye" cx="65.5" cy="34.2" rx="3.7" ry="5.4" fill="#112452"/>
    <path id="mouth" d="M45.8 39.7c1.7 2.1 3.7 3.1 6.2 3.1 2.7 0 4.7-1.1 6.3-3.1"
          fill="none" stroke="#112452" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Folder back and yellow tab. -->
  <g id="folder-back" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.4 40.5h22.9c1.4 0 2.3.6 3 1.8l4.3 6.8h56.7c3.1 0 4.6 1.9 4.2 4.9l-4.8 39c-.3 2.2-1.7 3.5-4.2 3.5H16.1c-2.6 0-4.1-1.2-4.6-3.6L2.2 46c-.6-3.4.6-5.5 3.2-5.5Z"
          fill="url(#folderTab)" stroke="#ffffff" stroke-width="7"/>
    <path d="M5.4 40.5h22.9c1.4 0 2.3.6 3 1.8l4.3 6.8h56.7c3.1 0 4.6 1.9 4.2 4.9l-4.8 39c-.3 2.2-1.7 3.5-4.2 3.5H16.1c-2.6 0-4.1-1.2-4.6-3.6L2.2 46c-.6-3.4.6-5.5 3.2-5.5Z"
          fill="url(#folderTab)" stroke="#112452" stroke-width="3.4"/>
  </g>

  <!-- Blue front panel. The clipped paths remain independently editable shading layers. -->
  <g id="folder-front" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5.8 57.1h25.7c1.8 0 3.1-1 3.9-2.5l2.5-4.8h57.8l-4.5 42.6c-.2 1.7-1.5 2.6-3.7 2.6H16.1c-2.3 0-3.7-1-4.1-2.9Z"
          fill="url(#folderBlue)"/>

    <g clip-path="url(#folderFrontClip)">
      <path d="M36.4 51.7h59.8l-.4 3.4H34.7Z" fill="url(#topShine)"/>
      <path d="M8.2 92.5c27.8-2 59.5-13.2 85-29.9l-3.3 33.8H12Z" fill="#1556c3" fill-opacity=".86"/>
      <path d="M5.2 57.2h5.3l6.4 36.1-5.6.6Z" fill="url(#leftShine)"/>
    </g>

    <path d="M5.8 57.1h25.7c1.8 0 3.1-1 3.9-2.5l2.5-4.8h57.8l-4.5 42.6c-.2 1.7-1.5 2.6-3.7 2.6H16.1c-2.3 0-3.7-1-4.1-2.9Z"
          fill="none" stroke="#112452" stroke-width="3.4"/>
  </g>
</svg>
