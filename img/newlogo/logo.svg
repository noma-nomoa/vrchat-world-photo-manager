<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="100" height="100" viewBox="0 0 100 100"
     role="img" aria-labelledby="title desc">
  <title id="title">Cat peeking over a blue folder</title>
  <desc id="desc">A white cat with orange ears peeking from a blue and yellow folder, outlined in navy and white.</desc>

  <defs>
    <!-- Shared geometry. Every outline and the white keyline reuse these paths, so edges always coincide. -->
    <!-- The cat is mirrored around x = 52. -->
    <path id="ear-left" d="M20.2 52V8.6C20.2 4.6 22.7 3.2 25.8 5.3L41.6 16.2 30 34Z"/>
    <path id="ear-right" d="M83.8 52V8.6C83.8 4.6 81.3 3.2 78.2 5.3L62.4 16.2 74 34Z"/>
    <path id="face" d="M20.2 60.2V49.8C20.2 27.2 36.4 11.6 52 11.6S83.8 27.2 83.8 49.8v10.4Z"/>
    <!-- The folder left edge is one straight line from the tab down to the bottom corner. -->
    <path id="folder-back" d="M5.8 57.1 3.5 44C3.1 41.8 4.1 40.5 6.2 40.5h22.1c1.4 0 2.3.6 3 1.8l4.3 7.2H60V66H12Z"/>
    <path id="folder-front" d="M5.8 57.1h25.7c1.8 0 3.1-1 3.9-2.5l2.4-5.1h57.8l-4.5 42.8c-.2 1.8-1.5 2.8-3.6 2.8H15.3c-1.9 0-3-.9-3.4-2.8Z"/>

    <linearGradient id="earFill" x1="0" y1="6" x2="0" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fe6e06"/>
      <stop offset="1" stop-color="#fc7309"/>
    </linearGradient>
    <linearGradient id="folderTab" x1="0" y1="41" x2="0" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#feb305"/>
      <stop offset="1" stop-color="#fdb005"/>
    </linearGradient>
    <linearGradient id="folderBlue" x1="0" y1="50" x2="0" y2="95" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3577dc"/>
      <stop offset="1" stop-color="#3274da"/>
    </linearGradient>
    <linearGradient id="topShine" x1="0" y1="51" x2="0" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9bd6ff"/>
      <stop offset="0.55" stop-color="#438ce4"/>
      <stop offset="1" stop-color="#3577dc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="leftShine" x1="0" y1="58" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4fa5ee" stop-opacity=".7"/>
      <stop offset="1" stop-color="#4fa5ee" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="folderFrontClip">
      <use href="#folder-front"/>
    </clipPath>
  </defs>

  <!-- White keyline around the whole silhouette. -->
  <g id="keyline" fill="#ffffff" stroke="#ffffff" stroke-width="7" stroke-linejoin="round">
    <use href="#ear-left"/>
    <use href="#ear-right"/>
    <use href="#face"/>
    <use href="#folder-back"/>
    <use href="#folder-front"/>
  </g>

  <!-- Ears sit behind the face. Their lower part is hidden by the face, so the outer contour runs straight down. -->
  <g id="ears" fill="#112452" stroke="#112452" stroke-width="3.4" stroke-linejoin="round">
    <use href="#ear-left"/>
    <use href="#ear-right"/>
  </g>
  <path d="M23.2 26C23 19.4 23.1 12.9 23.7 8.7c.3-1.7 1.2-2.2 2.6-1.2L37.6 15Z" fill="url(#earFill)"/>
  <path d="M80.8 26C81 19.4 80.9 12.9 80.3 8.7c-.3-1.7-1.2-2.2-2.6-1.2L66.4 15Z" fill="url(#earFill)"/>

  <g id="cat-face">
    <use href="#face" fill="#fefefe" stroke="#112452" stroke-width="3.4" stroke-linejoin="round"/>
    <ellipse cx="38.5" cy="34.2" rx="3.7" ry="5.4" fill="#112452"/>
    <ellipse cx="65.5" cy="34.2" rx="3.7" ry="5.4" fill="#112452"/>
    <path d="M45.7 39.8C47.4 41.9 49.5 42.9 52 42.9S56.6 41.9 58.3 39.8"
          fill="none" stroke="#112452" stroke-width="3.2" stroke-linecap="round"/>
  </g>

  <!-- Folder back: only the yellow tab is visible; the rest is covered by the front panel. -->
  <use href="#folder-back" fill="url(#folderTab)" stroke="#112452" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- Blue front panel with clipped shading layers. -->
  <g id="folder-front-panel">
    <use href="#folder-front" fill="url(#folderBlue)"/>
    <g clip-path="url(#folderFrontClip)">
      <path d="M36 51.3h62v3.6H34Z" fill="url(#topShine)"/>
      <path d="M8 93.2C35.8 91.2 67.6 80 93.6 63.2L90 97H8Z" fill="#1556c3" fill-opacity=".86"/>
      <!-- Left highlight runs parallel to the folder left edge. -->
      <path d="M4.8 57.1h5.4l6.1 35.4H10.9Z" fill="url(#leftShine)"/>
    </g>
    <use href="#folder-front" fill="none" stroke="#112452" stroke-width="3.4" stroke-linejoin="round"/>
  </g>
</svg>
